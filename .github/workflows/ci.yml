name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and type-check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2

      - name: Run checks
        run: uv run poe check

  test-ubuntu:
    name: Apply on Ubuntu
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Build CI image
        run: ci/run.sh build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify installed tools and configs
        run: ci/run.sh verify

      - name: Idempotency check
        run: ci/run.sh idempotency
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
